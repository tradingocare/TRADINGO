user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Security headers moved to snippets/security-headers.conf (server-level include).
  # http-level add_header would be dropped by any block that declares its own add_header.

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "cf_connecting_ip=$http_cf_connecting_ip" "x_forwarded_for=$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main buffer=16k;
  error_log /var/log/nginx/error.log warn;

  # Hide upstream platform headers (Next.js, Express, etc.)
  proxy_hide_header X-Powered-By;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_disable "msie6";
  gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

  include /etc/nginx/sites/*.conf;
}
