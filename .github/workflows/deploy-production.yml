name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

env:
  REGISTRY: \${{ secrets.DOCKER_REGISTRY }}
  IMAGE_TAG: \${{ github.sha }}

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    outputs:
      can_deploy: \${{ steps.confirm.outputs.valid }}
    steps:
      - name: Check confirmation
        id: confirm
        run: |
          if [ "\${{ github.event.inputs.confirm }}" = "deploy" ]; then
            echo "valid=true" >> \$GITHUB_OUTPUT
          else
            echo "valid=false" >> \$GITHUB_OUTPUT
            echo "ERROR: Confirmation must be 'deploy'"
            exit 1
          fi

      - name: Validate required secrets
        run: |
          echo "Checking required secrets are configured..."
          echo "DOCKER_REGISTRY: \${{ secrets.DOCKER_REGISTRY && 'configured' || 'MISSING' }}"
          echo "VPS_HOST: \${{ secrets.VPS_HOST && 'configured' || 'MISSING' }}"
          echo "VPS_SSH_KEY: \${{ secrets.VPS_SSH_KEY && 'configured' || 'MISSING' }}"
          
          if [ -z "\${{ secrets.VPS_HOST }}" ] || [ -z "\${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ERROR: VPS_HOST and VPS_SSH_KEY secrets are required"
            echo "See docs/deployment/PRODUCTION-DEPLOYMENT.md for setup instructions"
            exit 1
          fi
          echo "All required secrets configured"

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [validate]
    if: needs.validate.outputs.can_deploy == '"'"'true'"'"'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Docker registry
        run: |
          REGISTRY="\${{ secrets.DOCKER_REGISTRY }}"
          if [ -z "\$REGISTRY" ]; then
            REGISTRY="docker.io"
          fi
          echo "REGISTRY=\$REGISTRY" >> \$GITHUB_ENV

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: \${{ env.REGISTRY }}
          username: \${{ secrets.DOCKER_USERNAME }}
          password: \${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for API
        uses: docker/metadata-action@v5
        with:
          images: \${{ env.REGISTRY}}/\${{ secrets.DOCKER_IMAGE_NAME || 'tradingo-api' }}
          tags: |
            type=sha,prefix=
            type=latest

      - name: Build and push API image
        run: |
          echo "Building API image..."
          echo "NOTE: Add docker/build-push-action steps here after configuring DOCKER_REGISTRY"
          echo "Image tag: \${{ env.REGISTRY}}/\${{ secrets.DOCKER_IMAGE_NAME || 'tradingo-api' }}:\${{ github.sha }}"
          echo "::warning::Docker build step requires DOCKER_REGISTRY and image name to be configured"

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [validate, build-and-push]
    if: needs.validate.outputs.can_deploy == '"'"'true'"'"'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: \${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H -p \${{ secrets.VPS_PORT || '22' }} \${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via Docker Compose
        run: |
          echo "=== Production Deployment ==="
          echo "VPS: \${{ secrets.VPS_HOST }}"
          echo ""
          echo "Deployment requires:"
          echo "1. SSH access to VPS (configured via secrets)"
          echo "2. docker-compose.prod.yml on VPS at /home/tradingo/tradingo/"
          echo "3. .env.production.local with production secrets"
          echo ""
          echo "Run these commands on the VPS:"
          echo ""
          echo "  # Pull latest code"
          echo "  cd /home/tradingo/tradingo && git pull origin main"
          echo ""
          echo "  # Pull latest Docker images (if using registry)"
          echo "  docker compose --env-file .env.production.local -f docker-compose.prod.yml pull"
          echo ""
          echo "  # Rebuild API (to pick up any API changes)"
          echo "  docker compose --env-file .env.production.local -f docker-compose.prod.yml build api"
          echo ""
          echo "  # Restart services"
          echo "  docker compose --env-file .env.production.local -f docker-compose.prod.yml up -d --force-recreate --no-deps api"
          echo ""
          echo "  # Or full restart"
          echo "  docker compose --env-file .env.production.local -f docker-compose.prod.yml restart"
          echo ""
          echo "::warning::This workflow is a template. Full Docker registry integration"
          echo "requires DOCKER_REGISTRY, DOCKER_USERNAME, DOCKER_PASSWORD secrets."
          echo "See docs/deployment/PRODUCTION-DEPLOYMENT.md"