name: Deploy Production

# REAL Hostinger VPS deployment (SSH + Docker Compose, images built in CI).
# Replaces the former echo/template implementation.
#
# IMAGE POLICY (2026-10-19): api / api-migrate / web images are built by the
#   `Build Production Images` workflow (build-images.yml), pushed to GHCR and
#   tagged with the exact commit SHA. This workflow PULLS the images for
#   $TARGET_SHA and retags them to the compose-local names instead of
#   building on-host: the VPS (3.9GB RAM / 1 vCPU) livelocks on the web
#   build (run 39204845542). A missing image for the target SHA aborts
#   BEFORE the backup gate, with the previous containers untouched.
#
# Design notes (do not weaken without founder approval):
# - Manual dispatch only, and only from the `main` ref: a dispatch launched
#   from any other workflow ref fails closed before any secret or SSH use.
#   Each run requires the typed confirmation below. NOTE (verified 2026-10-13):
#   the `production` environment currently has NO required reviewers, so its
#   gate resolves immediately — effective approval is dispatch permission
#   (write access) plus the typed confirmation. This is NOT two-person review.
#   To restore a reviewer checkpoint, add an eligible reviewer under Settings
#   → Environments → production (founder decision; weigh self-review
#   protection for single-account operation). No push trigger.
# - The release is pinned to the exact SHA of `origin/main` resolved on the
#   VPS at deploy time — never an operator-supplied branch, tag, or SHA, and
#   never "latest whatever happens to be on main at build time".
# - Host trust is pinned, not discovered: SSH uses a founder-provisioned
#   `VPS_KNOWN_HOSTS` secret (verified out-of-band); runtime `ssh-keyscan`
#   trust-on-first-use is forbidden in this workflow.
# - Before checkout, a preservation gate (`scripts/deploy/checkout-preservation.sh`,
#   read from the target release itself) relocates untracked files that collide
#   with new target paths into a unique timestamped recovery directory outside
#   the repository (`<app-dir>-recovery/untracked-<UTC>-<PID>/`, mode 700),
#   verifies every copy by hash, and only then clears the sources. Any failure
#   aborts before checkout with the working tree untouched. Ignored files that
#   collide (secrets/certificates) abort the run for manual resolution.
# - Migrations run via the api-migrate compose target BEFORE containers are
#   recreated. Forward-only (`prisma migrate deploy`); there is no
#   down-migration path by design.
# - Compose project is pinned to `tradingo-prod` (live volumes are
#   `tradingo-prod_*`; an explicit -p prevents operating on/creating a
#   parallel stack). Dependency startup is deliberately disabled (`--no-deps`
#   on migrate-run and recreate): PostgreSQL is managed by a separate compose
#   project under a fixed container name, so resolving dependencies would
#   collide instead of help. Dependency health is verified by an explicit
#   pre-flight step; migration and smoke tests prove connectivity end to end.
# - On health-check failure this workflow FAILS LOUDLY and stops. It never
#   auto-rolls back. The previous release SHA is printed with the exact
#   manual rollback commands (see ROLLBACK section below + rollback step).
# - Claiming success requires proof (added 2026-10-19 after runs 39214456391
#   and 39218521897 completed confusingly): after `up`, the RUNNING
#   containers' image IDs must equal the SHA-tagged images pulled from GHCR
#   (scripts/deploy/verify-release-images.sh; regression tests in
#   scripts/deploy/tests/test-release-image-identity.sh), the checkout must
#   be verified to sit on exactly TARGET_SHA, and the remote script must emit
#   its terminal marker TRADINGO_DEPLOY_VERIFIED_OK which the runner greps in
#   the teed remote log. Mutable tags are never accepted as release proof.
#
# BACKUP POLICY (fail-closed): a database backup is attempted before every
#   release via scripts/deploy/manage.sh backup, then
#   scripts/deploy/verify-backup.sh requires a FRESH verified backup
#   (status=OK, recent timestamp, existing non-empty artifact) BEFORE any
#   migration or service recreation runs. Without one the rollout stops.
#   Documented exception only: dispatch with skip_fresh_backup=true (recorded
#   in the run inputs, loud ::warning:: in logs) when a known-good backup
#   exists or the release cannot wait (e.g. security fix). Data restore stays
#   a separate deliberate decision in every case (see ROLLBACK below).
#
# ROLLBACK (manual, only after verifying the previous release was healthy).
#   Release images live on GHCR tagged by SHA and are pulled anonymously.
#   Images exist for every main commit built by build-images; for earlier
#   releases fall back to the preserved rollback images/containers.
#   ssh tradingo@<VPS_HOST> 'cd /home/tradingo/tradingo \
#     && PREV=<sha-printed-by-failed-run> && REG=ghcr.io/tradingocare \
#     && docker pull $REG/tradingo-api:$PREV \
#     && docker pull $REG/tradingo-api-migrate:$PREV \
#     && docker pull $REG/tradingo-web:$PREV \
#     && git checkout $PREV \
#     && docker tag $REG/tradingo-api:$PREV tradingo-prod-api:latest \
#     && docker tag $REG/tradingo-api-migrate:$PREV tradingo-prod-api-migrate:latest \
#     && docker tag $REG/tradingo-web:$PREV tradingo-prod-web:latest \
#     && docker compose -p tradingo-prod --env-file .env.production.local \
#          -f docker-compose.prod.yml up -d --no-deps api web \
#     && bash scripts/deploy/smoke-test.sh http://localhost:3001 http://localhost:3000'
#   Database restore is a separate, deliberate decision (forward-only
#   migrations are not reversed automatically):
#   `bash scripts/deploy/manage.sh restore backups/tradingo-<DATE>.sql.gz`
#   See docs/deployment/ROLLBACK-PROCEDURE.md for the full procedure.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string
      skip_fresh_backup:
        description: 'Documented exception only: "true" proceeds without a fresh verified backup'
        required: false
        default: false
        type: boolean

# Serialize production deployments: a second dispatch waits instead of
# running concurrently against the same VPS working tree. The remote script
# additionally holds an advisory mkdir lock as defense in depth.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Deployment
    # Environment-scoped secrets (VPS_HOST/VPS_SSH_KEY/VPS_KNOWN_HOSTS) are
    # visible ONLY to jobs declaring this environment. Without this line the
    # presence check reads empty values and fails closed (see run 38514946256).
    environment: production
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.confirm.outputs.valid }}
      target_ref: ${{ steps.confirm.outputs.target_ref }}
    steps:
      - name: Check confirmation
        id: confirm
        # Injection hygiene: operator-influenced contexts enter ONLY as step
        # environment variables, never as ${{ }} fragments inside shell code.
        # Quoted shell comparisons below then operate on plain data.
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM_INPUT" = "deploy" ]; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "ERROR: Confirmation must be 'deploy'"
            exit 1
          fi
          # Single-account lockdown: this workflow file must run from `main`.
          # A dispatch launched from any other ref fails here, before any
          # secret is touched or any SSH connection is opened.
          if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "ERROR: production deployment is allowed only from the main branch (this run uses $WORKFLOW_REF)"
            exit 1
          fi
          # Releases track origin/main only; the exact SHA is resolved on the
          # VPS at deploy time (see deploy step), never operator-supplied.
          echo "target_ref=origin/main" >> $GITHUB_OUTPUT
          echo "Target ref: origin/main"

      - name: Validate required secrets
        run: |
          echo "Checking required secrets are configured (names only, values never printed)..."
          echo "VPS_HOST: ${{ secrets.VPS_HOST && 'configured' || 'MISSING' }}"
          echo "VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY && 'configured' || 'MISSING' }}"
          echo "VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS && 'configured' || 'MISSING' }}"

          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ] || [ -z "${{ secrets.VPS_KNOWN_HOSTS }}" ]; then
            echo "ERROR: VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS secrets are required"
            echo "VPS_KNOWN_HOSTS must hold verified known_hosts line(s) for the VPS (see docs/deployment/VPS-DEPLOYMENT-GUIDE.md section 12)"
            echo "See docs/deployment/PRODUCTION-DEPLOYMENT.md for setup instructions"
            exit 1
          fi
          echo "All required secrets configured"

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    # Production environment gate: consults the `production` environment before
    # any command reaches the VPS. NOTE (verified 2026-10-13): no required
    # reviewers are currently configured there, so it resolves immediately;
    # see the header note before relying on this as an approval checkpoint.
    # Never remove this gate without founder approval.
    environment: production
    needs: [validate]
    if: needs.validate.outputs.can_deploy == 'true'
    timeout-minutes: 100
    steps:
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install pinned VPS host keys
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Pinned trust only: host keys come from the founder-provisioned
          # secret, verified out-of-band. Runtime ssh-keyscan discovery is
          # forbidden here (TOFU against an unauthenticated network peer).
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Fail closed on malformed content: at least one recognizable SSH
          # public-key line must be present (also matches hashed known_hosts).
          grep -qE '(ssh-(ed25519|rsa|ecdsa|dss)|sk-ssh-ed25519@|sk-ecdsa-sha2-)' ~/.ssh/known_hosts \
            || { echo "ERROR: VPS_KNOWN_HOSTS does not contain a recognizable SSH host key"; exit 1; }
          echo "Pinned VPS host keys installed (StrictHostKeyChecking stays enforced)."

      - name: Deploy release to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER || 'tradingo' }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/home/tradingo/tradingo' }}
          TARGET_REF: ${{ needs.validate.outputs.target_ref }}
          # GHCR namespace holding the CI-built release images (public
          # packages linked to this public repository; pulls are anonymous).
          GHCR_OWNER: ${{ github.repository_owner }}
          # Documented stale-backup exception (default false). Passed through
          # as data only; the remote gate decides.
          SKIP_FRESH_BACKUP: ${{ github.event.inputs.skip_fresh_backup }}
        run: |
          set -euo pipefail
          # Fail closed on unexpected ref characters (branch/tag/SHA only).
          if [[ ! "$TARGET_REF" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "ERROR: target ref contains unexpected characters: $TARGET_REF"
            exit 1
          fi
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=yes -p $VPS_PORT"
          # Backstop: the whole remote session must finish within 90 minutes.
          # Must stay below the job timeout (100 min) with margin for the
          # status-report step and agent cleanup. Exit 124 means THIS backstop
          # fired (remote deploy exceeded 90 min), not the job timeout.
          # The remote log is teed so the terminal marker can be verified
          # after the pipeline without losing live streaming.
          timeout 5400 ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" "SKIP_FRESH_BACKUP='$SKIP_FRESH_BACKUP' TARGET_REF='$TARGET_REF' APP_DIR='$VPS_APP_DIR' GHCR_OWNER='$GHCR_OWNER' bash -s" << 'REMOTE_EOF' | tee "$RUNNER_TEMP/deploy-remote.log"
          set -euo pipefail
          # BEGIN SKIP_FRESH_BACKUP handling (tested: scripts/deploy/tests/test-backup-timeout-gates.sh)
          # Default closed when absent/empty; only the explicit dispatch value
          # "true" enables the documented stale-backup exception. Anything else
          # aborts: never silently coerce malformed input.
          # NOTE: this file uses CRLF line endings; avoid `case...in` here
          # because a trailing CR breaks reserved-word recognition.
          : "${SKIP_FRESH_BACKUP:=false}"
          if [ "$SKIP_FRESH_BACKUP" = "true" ] || [ "$SKIP_FRESH_BACKUP" = "false" ]; then
            :
          else
            echo "ERROR: SKIP_FRESH_BACKUP must be 'true' or 'false'"; exit 1
          fi
          # END SKIP_FRESH_BACKUP handling
          cd "$APP_DIR" || { echo "ERROR: app directory $APP_DIR missing on VPS"; exit 1; }
          test -f docker-compose.prod.yml || { echo "ERROR: docker-compose.prod.yml missing in $APP_DIR"; exit 1; }
          test -f .env.production.local || { echo "ERROR: .env.production.local missing in $APP_DIR (tracked placeholder .env.production must never be used)"; exit 1; }

          COMPOSE="docker compose -p tradingo-prod --env-file .env.production.local -f docker-compose.prod.yml"

          # CI image namespace: must be a plain lowercase GHCR owner.
          # repository_owner is lowercase for this repo; normalize defensively.
          GHCR_OWNER="${GHCR_OWNER,,}"
          if [[ ! "$GHCR_OWNER" =~ ^[a-z0-9-]+$ ]]; then
            echo "ERROR: invalid GHCR owner: '$GHCR_OWNER'"
            exit 1
          fi

          echo "=== Fetching release ==="
          git fetch origin || { echo "ERROR: git fetch failed"; exit 1; }
          TARGET_SHA="$(git rev-parse "$TARGET_REF")" || { echo "ERROR: unknown ref $TARGET_REF"; exit 1; }
          PREV_SHA="$(git rev-parse HEAD)"
          echo "Previous release: $PREV_SHA"
          echo "Target release:   $TARGET_SHA"
          if [ "$PREV_SHA" = "$TARGET_SHA" ]; then
            echo "Target already deployed; refreshing containers to converge state."
          fi
          echo "=== Pre-checkout: untracked collision preservation ==="
          # Runs the target release's own preservation gate (read from the
          # fetched commit, not the current checkout) so untracked files that
          # collide with new target paths are preserved to a unique recovery
          # directory, verified, and cleared. Aborts before checkout on any
          # failure. See scripts/deploy/checkout-preservation.sh.
          PRESERVE_TMP="$(mktemp)"
          git show "$TARGET_SHA:scripts/deploy/checkout-preservation.sh" > "$PRESERVE_TMP" || { echo "ERROR: cannot read preservation gate from target release $TARGET_SHA"; exit 1; }
          APP_DIR="$APP_DIR" TARGET_SHA="$TARGET_SHA" bash "$PRESERVE_TMP" || { echo "ERROR: collision preservation failed; checkout aborted"; rm -f "$PRESERVE_TMP"; exit 1; }
          rm -f "$PRESERVE_TMP"
          git checkout "$TARGET_SHA" || { echo "ERROR: checkout of $TARGET_SHA failed"; exit 1; }
          # Fail closed if the working tree did not land on the exact release
          # commit: everything below must only ever act on TARGET_SHA.
          [ "$(git rev-parse HEAD)" = "$TARGET_SHA" ] || { echo "ERROR: checkout landed on $(git rev-parse HEAD), expected $TARGET_SHA; refusing to continue"; exit 1; }

          echo "=== Pre-flight: dependency health (fail fast on broken estate) ==="
          # NOTE: postgres/redis are intentionally NOT started here. PostgreSQL
          # is managed by a separate compose project and shares a fixed
          # container name, so dependency startup would collide instead of
          # help. Every compose invocation below uses --no-deps (matching all
          # historical successful hand operations); health is verified here,
          # connectivity is proven by the gated migration run, and end-to-end
          # readiness by the smoke tests. A missing/unhealthy dependency stops
          # the rollout before backup, migration, or recreation.
          for svc in tradingo-postgres tradingo-redis; do
            if ! docker inspect "$svc" >/dev/null 2>&1; then
              echo "ERROR: required container $svc is missing. Resolve before deploying."
              exit 1
            fi
            running="$(docker inspect --format '{{.State.Running}}' "$svc")"
            if [ "$running" != "true" ]; then
              echo "ERROR: required container $svc is not running. Resolve before deploying."
              exit 1
            fi
            health="$(docker inspect --format '{{.State.Health.Status}}' "$svc" 2>/dev/null || true)"
            if [ -n "$health" ] && [ "$health" != "healthy" ]; then
              echo "ERROR: required container $svc reports health '$health'. Resolve before deploying."
              exit 1
            fi
            echo "$svc: running."
          done

          echo "=== Pulling CI-built release images (pinned to target SHA) ==="
          # Images are built by the Build Production Images workflow and tagged
          # with the exact commit SHA. Pulling BEFORE the backup/migration
          # gates means a missing release aborts with zero mutations.
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: unexpected TARGET_SHA format: $TARGET_SHA"
            exit 1
          fi
          GHCR_BASE="ghcr.io/$GHCR_OWNER"
          API_IMAGE="$GHCR_BASE/tradingo-api:$TARGET_SHA"
          API_MIGRATE_IMAGE="$GHCR_BASE/tradingo-api-migrate:$TARGET_SHA"
          WEB_IMAGE="$GHCR_BASE/tradingo-web:$TARGET_SHA"
          for img in "$API_IMAGE" "$API_MIGRATE_IMAGE" "$WEB_IMAGE"; do
            docker pull "$img" || { echo "ERROR: failed to pull $img. Ensure the 'Build Production Images' workflow succeeded for this SHA and the GHCR package is publicly readable."; exit 1; }
          done
          # Compose services api/api-migrate/web declare build: contexts, so
          # they resolve to project-local image names (tradingo-prod-api,
          # -api-migrate, -web). Retagging converges compose onto the pulled
          # images WITHOUT touching docker-compose.prod.yml, which must stay
          # identical to the release SHA being deployed. up -d recreates the
          # containers because the image ID changed.
          docker tag "$API_IMAGE" tradingo-prod-api:latest
          docker tag "$API_MIGRATE_IMAGE" tradingo-prod-api-migrate:latest
          docker tag "$WEB_IMAGE" tradingo-prod-web:latest
          echo "Release images pulled and retagged for $TARGET_SHA."
          # Record immutable release identities (image ID + registry digest)
          # in the run log: mutable tags are not proof of release identity.
          for entry in "api:$API_IMAGE" "api-migrate:$API_MIGRATE_IMAGE" "web:$WEB_IMAGE"; do
            name="${entry%%:*}"
            img="${entry#*:}"
            id="$(docker image inspect --format '{{.Id}}' "$img")"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$img" 2>/dev/null || echo '<none>')"
            echo "RELEASE_IMAGE $name tag=$img id=$id digest=$digest"
          done

          echo "=== Pre-deploy database backup (best effort, then verified) ==="
          if bash scripts/deploy/manage.sh backup; then
            echo "Pre-deploy backup complete."
          else
            echo "::warning::Pre-deploy backup attempt failed; the verification gate below decides whether to proceed."
          fi

          echo "=== Verifying usable backup (fail-closed gate) ==="
          # No migration or service replacement without a fresh verified backup,
          # unless the dispatcher set the documented stale-backup exception
          # (skip_fresh_backup=true), which is recorded in the run inputs.
          ALLOW_STALE_BACKUP="$SKIP_FRESH_BACKUP" bash scripts/deploy/verify-backup.sh || { echo "ERROR: no fresh verified backup and no documented exception; resolve backup health before retrying"; exit 1; }

          echo "=== Running migrations (exit-gated; previous containers still live) ==="
          # stdin is redirected from /dev/null: this remote script is fed to
          # `bash -s` over stdin, and `docker compose run` attaches stdin by
          # default. On 2026-10-19 (run 39214456391) the attached migrate
          # container consumed the remainder of this script, so the recreate
          # and smoke-test steps silently never ran while the run still
          # reported success. Never let a child process read the deploy
          # script.
          $COMPOSE run -T --rm --no-deps api-migrate </dev/null || { echo "ERROR: migration failed; previous containers untouched. Resolve before retrying."; exit 1; }

          echo "=== Recreating services ==="
          $COMPOSE up -d --no-deps api web </dev/null || { echo "ERROR: service recreate failed"; exit 1; }

          echo "=== Verifying running containers are the release images (fail closed) ==="
          # Regression guard for run 39218521897 ("success" without the
          # recreate/smoke steps ever running) and 39214456391: the deployment
          # may only claim the release applied if the RUNNING container image
          # IDs equal the SHA-tagged release image IDs pulled above.
          # Regression-test: scripts/deploy/tests/test-release-image-identity.sh
          bash scripts/deploy/verify-release-images.sh "$TARGET_SHA" "$GHCR_OWNER" || { echo "ERROR: running containers do not match release $TARGET_SHA; deployment NOT applied"; exit 1; }

          echo "=== Health checks ==="
          if bash scripts/deploy/smoke-test.sh http://localhost:3001 http://localhost:3000; then
            echo "Health checks passed."
          else
            echo "::error::Health checks FAILED. NOT rolling back automatically."
            echo "If the previous release ($PREV_SHA) was healthy, roll back manually:"
            echo "  docker pull ghcr.io/$GHCR_OWNER/tradingo-api:$PREV_SHA && docker pull ghcr.io/$GHCR_OWNER/tradingo-api-migrate:$PREV_SHA && docker pull ghcr.io/$GHCR_OWNER/tradingo-web:$PREV_SHA"
            echo "  git checkout $PREV_SHA && docker tag ghcr.io/$GHCR_OWNER/tradingo-api:$PREV_SHA tradingo-prod-api:latest && docker tag ghcr.io/$GHCR_OWNER/tradingo-api-migrate:$PREV_SHA tradingo-prod-api-migrate:latest && docker tag ghcr.io/$GHCR_OWNER/tradingo-web:$PREV_SHA tradingo-prod-web:latest && $COMPOSE up -d --no-deps api web"
            echo "  then re-run the smoke test above. See the ROLLBACK header of this workflow file."
            exit 1
          fi

          echo "=== Release summary ==="
          echo "Deployed: $PREV_SHA -> $TARGET_SHA"
          $COMPOSE ps api web
          # Terminal marker: the runner-side grep below refuses to report
          # success unless this line is present, so the remote script cannot
          # end early (e.g. stdin consumption) and still pass the job.
          echo "TRADINGO_DEPLOY_VERIFIED_OK target=$TARGET_SHA"
          REMOTE_EOF
          # A remote run that ended before its terminal marker did not
          # complete the release (see the marker comment inside the script).
          # Note: if the SSH pipeline itself fails, `set -e` aborts before
          # this grep; reaching here means the marker check is authoritative.
          grep -q 'TRADINGO_DEPLOY_VERIFIED_OK target=' "$RUNNER_TEMP/deploy-remote.log" || { echo "::error::Remote deploy finished without the verified-complete marker; treating the release as NOT deployed"; exit 1; }

      - name: Report deployment status
        if: always()
        run: |
          echo "Deployment job status: ${{ job.status }} (target ref: ${{ needs.validate.outputs.target_ref }})"
