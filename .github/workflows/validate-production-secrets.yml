name: Validate Production Secrets

# Read-only secret-presence probe. Manual dispatch only. Declares the
# `production` environment SOLELY to receive environment-scoped secret
# visibility for presence checks — it performs no deployment, opens no SSH
# connections, and makes no network calls. Independent of Deploy Production
# (no needs/uses/workflow_run/workflow_call links in either direction).

on:
  workflow_dispatch:

# Least privilege: this workflow needs nothing from GitHub APIs or the repo
# (no checkout, no API calls). An empty mapping is valid and denies the
# automatic token all scopes; it does not affect manual dispatchability nor
# environment-secret visibility (governed by environment protection rules).
permissions: {}

jobs:
  check-secrets:
    name: Check Production Secrets Presence
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Report secret presence (names only)
        # Secrets enter ONLY as step environment variables, never as
        # expression fragments inside shell code: the script below operates
        # purely on variable names and emptiness, so secret values never
        # appear in script text, process arguments, traces, or logs.
        env:
          CHECK_VPS_HOST: ${{ secrets.VPS_HOST }}
          CHECK_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          CHECK_VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -n "${CHECK_VPS_HOST}" ]; then echo "VPS_HOST: configured"; else echo "VPS_HOST: MISSING"; fi
          if [ -n "${CHECK_VPS_SSH_KEY}" ]; then echo "VPS_SSH_KEY: configured"; else echo "VPS_SSH_KEY: MISSING"; fi
          if [ -n "${CHECK_VPS_KNOWN_HOSTS}" ]; then echo "VPS_KNOWN_HOSTS: configured"; else echo "VPS_KNOWN_HOSTS: MISSING"; fi
          if [ -z "${CHECK_VPS_HOST}" ] || [ -z "${CHECK_VPS_SSH_KEY}" ] || [ -z "${CHECK_VPS_KNOWN_HOSTS}" ]; then
            echo "ERROR: one or more required production secrets are missing"
            exit 1
          fi
          echo "All required production secrets are present (values never printed)."
