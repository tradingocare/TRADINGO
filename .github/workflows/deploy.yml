name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Environment protection — prevents auto-deploy without approval
# Requires GitHub environment "production" with required reviewers configured
concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY_API: tradingo-production-api
  ECR_REPOSITORY_WEB: tradingo-production-web
  ECS_CLUSTER: tradingo-production
  ECS_SERVICE_API: tradingo-production-api
  ECS_SERVICE_WEB: tradingo-production-web
  TASK_DEFINITION_API: tradingo-production-api
  TASK_DEFINITION_WEB: tradingo-production-web

jobs:
  validate:
    name: Validate Secrets
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check AWS_ACCOUNT_ID is configured
        run: |
          if [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ]; then
            echo "::error::AWS_ACCOUNT_ID secret is not configured. Set it in GitHub secrets."
            exit 1
          fi
          echo "AWS_ACCOUNT_ID is configured: OK"

  deploy:
    name: Build & Deploy
    needs: [validate]
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    outputs:
      previous-api: ${{ steps.previous.outputs.previous-api }}
      previous-web: ${{ steps.previous.outputs.previous-web }}
      api-attempted: ${{ steps.api-attempt.outputs.attempted }}
      web-attempted: ${{ steps.web-attempt.outputs.attempted }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_API }}:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_API }}:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_API }}:${{ github.ref_name }}

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_WEB }}:latest
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_WEB }}:${{ github.sha }}
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_WEB }}:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.tradingo.in/api/v1' }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://tradingo.in' }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL || 'https://tradingo.in' }}
            NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL || 'https://api.tradingo.in' }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || '' }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}

      - name: Substitute __AWS_ACCOUNT_ID__ in task definitions
        run: |
          sed -i "s/__AWS_ACCOUNT_ID__/${{ secrets.AWS_ACCOUNT_ID }}/g" infrastructure/ecs/task-definition.api.json
          sed -i "s/__AWS_ACCOUNT_ID__/${{ secrets.AWS_ACCOUNT_ID }}/g" infrastructure/ecs/task-definition.web.json
          sed -i "s/__AWS_ACCOUNT_ID__/${{ secrets.AWS_ACCOUNT_ID }}/g" infrastructure/ecs/task-definition.migration.json
          # Pin the migration image to this build (was :latest — could race other deployments)
          sed -i "s|tradingo-production-api:latest|tradingo-production-api:${{ github.sha }}|g" infrastructure/ecs/task-definition.migration.json
          echo "Task definition placeholders substituted"

      - name: Capture pre-deploy task definitions
        id: previous
        run: |
          PREV_API=$(aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE_API }} --query 'services[0].taskDefinition' --output text)
          PREV_WEB=$(aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE_WEB }} --query 'services[0].taskDefinition' --output text)
          for ARN in "$PREV_API" "$PREV_WEB"; do
            case "$ARN" in arn:aws:ecs:*:task-definition/*) : ;; *) echo "::error::Invalid pre-deploy task definition ARN"; exit 1;; esac
          done
          echo "previous-api=$PREV_API" >> $GITHUB_OUTPUT
          echo "previous-web=$PREV_WEB" >> $GITHUB_OUTPUT
          echo "Pre-deploy revisions captured (rollback baseline)"

      - name: Register migration task definition
        run: |
          aws ecs register-task-definition --cli-input-json file://infrastructure/ecs/task-definition.migration.json
          echo "Migration task definition registered"

      - name: Run database migrations (before service deploy)
        run: |
          aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition tradingo-production-migration \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.SUBNETS }}],securityGroups=[${{ secrets.SECURITY_GROUPS }}],assignPublicIp=ENABLED}"
          # Wait for migration completion
          TASK_ARN=$(aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --family tradingo-production-migration --query 'taskArns[0]' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::Migration task did not launch — aborting deployment"
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks $TASK_ARN
          TASK_INFO=$(aws ecs describe-tasks --cluster ${{ env.ECS_CLUSTER }} --tasks $TASK_ARN)
          EXIT_CODE=$(echo $TASK_INFO | jq -r '.tasks[0].containers[0].exitCode')
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE — aborting deployment"
            exit 1
          fi
          echo "Database migrations completed successfully"

      - name: Render API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infrastructure/ecs/task-definition.api.json
          container-name: api
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_API }}:${{ github.sha }}

      - name: Render Web task definition
        id: render-web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infrastructure/ecs/task-definition.web.json
          container-name: web
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_WEB }}:${{ github.sha }}

      - name: Deploy API to ECS
        id: deploy-api
        uses: aws-actions/amazon-ecs-deploy-service-definition@v1
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Record API update attempt
        id: api-attempt
        if: always()
        run: |
          if [ "${{ steps.deploy-api.outcome }}" = "skipped" ]; then
            echo "attempted=false" >> $GITHUB_OUTPUT
          else
            echo "attempted=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Web to ECS
        id: deploy-web
        uses: aws-actions/amazon-ecs-deploy-service-definition@v1
        with:
          task-definition: ${{ steps.render-web.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_WEB }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Record Web update attempt
        id: web-attempt
        if: always()
        run: |
          if [ "${{ steps.deploy-web.outcome }}" = "skipped" ]; then
            echo "attempted=false" >> $GITHUB_OUTPUT
          else
            echo "attempted=true" >> $GITHUB_OUTPUT
          fi

      - name: Health check - API (via ALB)
        run: |
          API_URL="${{ vars.API_URL }}"
          curl -f --retry 10 --retry-delay 10 --retry-max-time 120 "${API_URL:-https://api.tradingo.in}/live"

      - name: Health check - Web (via ALB)
        run: |
          WEB_URL="${{ vars.WEB_URL }}"
          curl -f --retry 10 --retry-delay 10 --retry-max-time 120 "${WEB_URL:-https://tradingo.in}"

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Deployment ${{ job.status == 'success' && 'succeeded' || 'failed' }} — `${{ github.sha }}`"
            }

  rollback:
    name: Rollback
    # Runs ONLY when the deploy job actually started and failed. Validation
    # failures, success, cancellation and skips keep this job skipped.
    # Restores the pre-deploy revisions captured by the deploy job — never the
    # live revisions (re-applying those could lock in a bad deployment).
    if: ${{ needs.deploy.result == 'failure' }}
    needs: [deploy]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify rollback baseline
        id: verify-baseline
        run: |
          PREV_API='${{ needs.deploy.outputs.previous-api }}'
          PREV_WEB='${{ needs.deploy.outputs.previous-web }}'
          API_ATTEMPTED='${{ needs.deploy.outputs.api-attempted }}'
          WEB_ATTEMPTED='${{ needs.deploy.outputs.web-attempted }}'
          echo "API update attempted: '$API_ATTEMPTED'"
          echo "Web update attempted: '$WEB_ATTEMPTED'"
          if [ "$API_ATTEMPTED" != "true" ] && [ "$WEB_ATTEMPTED" != "true" ]; then
            echo "::error::No service-update attempt recorded; manual verification required, skipping rollback."
            exit 1
          fi
          for ARN in "$PREV_API" "$PREV_WEB"; do
            case "$ARN" in arn:aws:ecs:*:task-definition/*) : ;; *) echo "::error::Missing or invalid pre-deploy revision; manual verification required, skipping rollback."; exit 1;; esac
          done
          echo "Rollback baseline verified (captured pre-deploy revisions)."

      - name: Rollback API service to previous task definition
        if: ${{ always() && steps.verify-baseline.outcome == 'success' }}
        run: |
          echo "Rolling back API to: ${{ needs.deploy.outputs.previous-api }}"
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE_API }} --task-definition ${{ needs.deploy.outputs.previous-api }} --force-new-deployment

      - name: Rollback Web service to previous task definition
        if: ${{ always() && steps.verify-baseline.outcome == 'success' }}
        run: |
          echo "Rolling back Web to: ${{ needs.deploy.outputs.previous-web }}"
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_SERVICE_WEB }} --task-definition ${{ needs.deploy.outputs.previous-web }} --force-new-deployment

      - name: Wait for rollback stability
        run: |
          aws ecs wait services-stable --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE_API }} ${{ env.ECS_SERVICE_WEB }}

      - name: Notify Slack rollback
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🔄 Production rollback ${{ job.status }} — ${{ github.sha }}"
            }
