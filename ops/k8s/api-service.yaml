apiVersion: v1
kind: Service
metadata:
  name: tradingo-api
  namespace: tradingo
  labels:
    app: tradingo-api
    app.kubernetes.io/name: tradingo-api
    app.kubernetes.io/part-of: tradingo-platform
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
  selector:
    app: tradingo-api
---
apiVersion: v1
kind: Service
metadata:
  name: tradingo-api-headless
  namespace: tradingo
  labels:
    app: tradingo-api
    app.kubernetes.io/name: tradingo-api
spec:
  clusterIP: None
  ports:
    - name: http
      port: 3001
      targetPort: http
  selector:
    app: tradingo-api
