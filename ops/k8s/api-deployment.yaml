apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradingo-api
  namespace: tradingo
  labels:
    app: tradingo-api
    app.kubernetes.io/name: tradingo-api
    app.kubernetes.io/part-of: tradingo-platform
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tradingo-api
  template:
    metadata:
      labels:
        app: tradingo-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/metrics"
        prometheus.io/port: "3001"
    spec:
      serviceAccountName: tradingo-api
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - tradingo-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: tradingo-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: tradingo-config
            - secretRef:
                name: tradingo-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /live
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /live
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10 && kill -SIGTERM 1"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tradingo-api
  namespace: tradingo
  labels:
    app.kubernetes.io/name: tradingo-api
    app.kubernetes.io/part-of: tradingo-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tradingo-api
  namespace: tradingo
  labels:
    app.kubernetes.io/name: tradingo-api
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tradingo-api
  namespace: tradingo
  labels:
    app.kubernetes.io/name: tradingo-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tradingo-api
subjects:
  - kind: ServiceAccount
    name: tradingo-api
    namespace: tradingo
