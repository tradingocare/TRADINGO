apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tradingo-ingress
  namespace: tradingo
  labels:
    app.kubernetes.io/name: tradingo-ingress
    app.kubernetes.io/part-of: tradingo-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30s"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30s"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://tradingo.in"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Requested-With, X-CSRF-Token"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - tradingo.in
        - www.tradingo.in
        - api.tradingo.in
      secretName: tradingo-tls
  rules:
    - host: tradingo.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tradingo-web
                port:
                  number: 3000
    - host: www.tradingo.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tradingo-web
                port:
                  number: 3000
    - host: api.tradingo.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tradingo-api
                port:
                  number: 3001
