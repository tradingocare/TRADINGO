# TRADINGO Kubernetes Secrets Template
# Usage:
#   1. Copy to tradingo-secrets.yaml
#   2. Fill in all placeholder values
#   3. NEVER commit tradingo-secrets.yaml to version control
#   4. Apply: kubectl apply -f tradingo-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: tradingo-secrets
  namespace: tradingo
  labels:
    app.kubernetes.io/name: tradingo
    app.kubernetes.io/part-of: tradingo-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://tradingo:CHANGE_ME@postgres:5432/tradingo"
  REDIS_URL: "redis://:CHANGE_ME@redis:6379"
  JWT_SECRET: "CHANGE_ME_REPLACE_WITH_64_CHAR_RANDOM"
  JWT_REFRESH_SECRET: "CHANGE_ME_REPLACE_WITH_64_CHAR_RANDOM"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  SENTRY_DSN: "https://CHANGE_ME@sentry.io/CHANGE_ME"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASS: "CHANGE_ME"
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"
  TWILIO_PHONE_NUMBER: "+1CHANGE_ME"
  GOOGLE_MAPS_API_KEY: "CHANGE_ME"
  GOOGLE_OAUTH_CLIENT_ID: "CHANGE_ME"
  GOOGLE_OAUTH_CLIENT_SECRET: "CHANGE_ME"
  OPENAI_API_KEY: "CHANGE_ME"
  OPENROUTER_API_KEY: "CHANGE_ME"
  TAVILY_API_KEY: "CHANGE_ME"
  FIRECRAWL_API_KEY: "CHANGE_ME"
  STRIPE_SECRET_KEY: "CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  RAZORPAY_KEY_ID: "CHANGE_ME"
  RAZORPAY_KEY_SECRET: "CHANGE_ME"
  RAZORPAY_WEBHOOK_SECRET: "CHANGE_ME"
  SMTP_HOST: "CHANGE_ME"
  SMTP_PORT: "587"
  PAYMENT_MODE: "live"
  NODE_ENV: "production"
