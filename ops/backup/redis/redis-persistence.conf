# TRADINGO Redis Persistence Configuration
# ===========================================
# Use with: redis-server /etc/redis/redis-persistence.conf
# Combines RDB (fast recovery) + AOF (durability) for enterprise-grade persistence

# --- RDB (Redis Database File) — Snapshot-based persistence ---
save 300 1         # Save if at least 1 key changed in 300s (5 min)
save 60 100        # Save if at least 100 keys changed in 60s
save 5 10000       # Save if at least 10000 keys changed in 5s

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
rdb-del-sync-files no

# --- AOF (Append-Only File) — Point-in-time durability ---
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# fsync policy: everysec balances durability vs performance
# - always: safest, slowest (~100 ops/sec)
# - everysec: good compromise (~1000 ops/sec) — may lose 1s of data
# - no: fastest, least safe
appendfsync everysec

# Rewrite AOF periodically to keep it compact
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# When loading AOF, truncate last incomplete command if present (avoids full reload failure)
aof-load-truncated yes

# Use RDB as base for AOF rewrite (Redis 7+)
aof-use-rdb-preamble yes

# --- Mixed persistence strategy ---
# TRADINGO uses both RDB and AOF:
# - RDB: Fast restarts, point-in-time backups every 5-300s
# - AOF: Durable writes, at most 1s of data loss with everysec fsync
# - Both: Redis uses AOF for recovery (most complete), RDB for fast snapshots
