version: "3.8"

# TRADINGO Backup Sidecar
# Deploys a backup agent container alongside the main stack
# Runs cron-scheduled backups without installing tools on host

x-backup-env: &backup-env
  BACKUP_DIR: /backups
  BACKUP_LOG_DIR: /var/log/tradingo/backups
  S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-tradingo-backups}
  S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-postgres}
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
  PG_DATABASE: ${PG_DATABASE:-tradingo}
  PG_HOST: postgres
  PG_PORT: 5432
  PG_USER: ${PG_USER:-tradingo}
  PG_PASSWORD: ${PG_PASSWORD:-secret123}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  AWS_REGION: ${AWS_REGION:-ap-south-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}

services:
  backup-agent:
    image: tradingo/backup-agent:latest
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: tradingo-backup-agent
    restart: unless-stopped
    environment:
      <<: *backup-env
    volumes:
      - backup-data:/backups
      - backup-logs:/var/log/tradingo/backups
      - postgres_data:/var/lib/postgresql/data:ro
      - redis_data:/data:ro
    networks:
      - tradingo-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.healthy && exit 0 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  backup-data:
    driver: local
  backup-logs:
    driver: local

networks:
  tradingo-net:
    external: true
