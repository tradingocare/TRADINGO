# TRADINGO Prometheus Alerting Rules
groups:
  - name: tradingo-api
    interval: 30s
    rules:
      - alert: APIHighErrorRate
        expr: rate(api_http_requests_total{status=~"5.."}[5m]) / rate(api_http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API error rate > 5%"
          description: "API 5xx error rate is {{ $value | humanizePercentage }} over 5m"

      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(api_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API P95 latency > 2s"
          description: "P95 latency is {{ $value }}s over 5m"

      - alert: APIHighP99Latency
        expr: histogram_quantile(0.99, rate(api_http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API P99 latency > 5s"
          description: "P99 latency is {{ $value }}s over 5m"

      - alert: APIDown
        expr: up{job="tradingo-api"} == 0
        for: 30s
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "API instance is down"
          description: "Instance {{ $labels.instance }} has been down for 30s"

      - alert: APIHighTrafficSpike
        expr: rate(api_http_requests_total[1m]) > 1000
        for: 1m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "API traffic spike > 1k req/s"
          description: "Traffic is {{ $value | humanize }} req/s over 1m"

  - name: tradingo-web
    interval: 30s
    rules:
      - alert: WebDown
        expr: up{job="tradingo-web"} == 0
        for: 30s
        labels:
          severity: critical
          team: frontend
        annotations:
          summary: "Web instance is down"
          description: "Instance {{ $labels.instance }} has been down for 30s"

  - name: tradingo-infrastructure
    interval: 30s
    rules:
      - alert: HighMemoryUsage
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Node memory < 10% available"
          description: "Available memory is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: HighDiskUsage
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Disk usage > 90%"
          description: "Disk is {{ $value | humanizePercentage }} free on {{ $labels.instance }}"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "CPU usage > 85%"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

  - name: tradingo-database
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is unreachable"

      - alert: PostgresHighConnections
        expr: sum(pg_stat_activity_count) by (instance) > 80
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "PostgreSQL connections > 80"
          description: "Active connections: {{ $value }} on {{ $labels.instance }}"

      - alert: PostgresReplicationLag
        expr: pg_replication_lag > 10
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "PostgreSQL replication lag > 10MB"
          description: "Replication lag is {{ $value }}MB on {{ $labels.instance }}"

      - alert: PrismaHighQueryLatency
        expr: histogram_quantile(0.95, rate(prisma_query_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Prisma P95 query latency > 500ms"
          description: "P95 query latency is {{ $value }}s over 5m"

  - name: tradingo-queue
    interval: 15s
    rules:
      - alert: QueueBacklog
        expr: bull_queue_waiting > 1000
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "BullMQ queue backlog > 1000"
          description: "Queue {{ $labels.queue }} has {{ $value }} waiting jobs"

      - alert: QueueHighFailureRate
        expr: bull_queue_failed > 100
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High failed jobs in queue"
          description: "Queue {{ $labels.queue }} has {{ $value }} failed jobs"

  - name: tradingo-business
    interval: 60s
    rules:
      - alert: NoRecentOrders
        expr: increase(business_orders_total[1h]) == 0
        for: 6h
        labels:
          severity: warning
          team: business
        annotations:
          summary: "No orders placed in 6 hours"
          description: "Zero new orders in the last 6 hours"

      - alert: HighOpenDisputes
        expr: business_disputes_open > 50
        for: 1h
        labels:
          severity: warning
          team: operations
        annotations:
          summary: "More than 50 open disputes"
          description: "{{ $value }} disputes are currently open"
