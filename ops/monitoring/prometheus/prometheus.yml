# TRADINGO Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert-rules.yml"
  - "recording-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "tradingo-api"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - "api:3001"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "api:3001"

  - job_name: "tradingo-web"
    static_configs:
      - targets:
          - "web:3000"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "web:3000"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "prometheus-postgres-exporter:9187"

  - job_name: "redis"
    static_configs:
      - targets:
          - "redis-exporter:9121"

  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter:9100"
