name: tradingo-prod

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  tradingo-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradingo-postgres
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tradingo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradingo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradingo-redis
    restart: unless-stopped
    networks:
      - tradingo-net
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tradingo-api
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/live"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    container_name: tradingo-api-migrate
    restart: "no"
    networks:
      - tradingo-net
    env_file:
      - .env.production
    environment:
      PRISMA_MIGRATE_DISABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Entrypoint runs migrations, then execs this command and exits.
    command: ["sh", "-c", "echo 'TRADINGO migrations applied'"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: tradingo-web
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: tradingo-nginx
    restart: unless-stopped
    networks:
      - tradingo-net
    # Only the reverse proxy is public; all other services stay on loopback.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/sites:/etc/nginx/sites:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    depends_on:
      - api
      - web

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: tradingo-prometheus
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: tradingo-pgexporter
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:9187:9187"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-tradingo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradingo}?sslmode=disable"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tradingo-grafana
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tradingo-alertmanager
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - ./ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: tradingo-redis-exporter
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      REDIS_ADDR: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: tradingo-node-exporter
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
