name: tradingo-prod

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  opensearch_data:

networks:
  tradingo-net:
    driver: bridge
  # DB lives in another compose project (tradingo-clean) on legacy network
  # tradingo_tradingo-net. Declared external so recreates converge instead of
  # dropping the API's database route. Never move postgres or its volume here;
  # never add a second OpenSearch service (standalone instance preserved).
  legacy-db:
    external: true
    name: tradingo_tradingo-net

services:
  # NOTE on the standalone database/redis services below:
  # Production PostgreSQL and Redis are NOT owned by this compose project. They
  # are the long-lived containers of the legacy `tradingo-clean` project, they
  # carry the fixed container names `tradingo-postgres` / `tradingo-redis`, and
  # the API reaches them through the external `legacy-db` network
  # (`tradingo_tradingo-net`), which is the only network that carries the
  # `postgres` DNS alias that DATABASE_URL uses.
  #
  # Declaring them here with those same container_name values is a name
  # collision: any `docker compose up` that includes them would fail against
  # the live containers (or, worse, create a second, empty database that
  # competes for the same DNS alias). They are therefore placed behind the
  # `standalone-db` profile: they are documentation of the topology and can
  # only ever be started deliberately, with
  #   docker compose -p <other-project> --profile standalone-db up -d
  # The supported production path never starts them — the deploy workflow
  # addresses the live legacy containers by name and runs every compose
  # command with --no-deps.
  postgres:
    image: postgres:16-alpine
    container_name: tradingo-postgres
    restart: unless-stopped
    profiles: ["standalone-db"]
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tradingo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-0.75}"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradingo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradingo-redis
    restart: unless-stopped
    # See the note above the `postgres` service: the live Redis is a legacy
    # container with this fixed name and must never be recreated by this
    # project. Opt-in only.
    profiles: ["standalone-db"]
    networks:
      - tradingo-net
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tradingo-api
    restart: unless-stopped
    networks:
      - tradingo-net
      - legacy-db
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env.production.local
    environment:
      NODE_ENV: production
      PORT: 3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0.75}"
          memory: 1G
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      # The live database and Redis belong to the legacy project and are
      # verified by the deploy workflow's pre-flight (container present,
      # running, healthy) before anything is replaced. They are deliberately
      # NOT declared as dependencies here: a dependency would re-enable their
      # `standalone-db` profile and make a bare `compose up` try to create
      # containers whose names are already taken by the live services.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/live"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    container_name: tradingo-api-migrate
    restart: "no"
    # The database is managed by the legacy compose project and only the
    # legacy network carries the `postgres` DNS alias that DATABASE_URL uses
    # (verified 2026-10-19: migration run 39212010080 could not resolve
    # `postgres` on tradingo-net alone). Must match the api service, which
    # joins both networks; without this the migrate container fails its
    # PostgreSQL readiness wait and aborts the release.
    networks:
      - tradingo-net
      - legacy-db
    volumes:
      - ./backups:/backups
    env_file:
      - .env.production.local
    environment:
      PRISMA_MIGRATE_DISABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The live database and Redis belong to the legacy project; see the note
    # on the `api` service. The migration entrypoint performs its own bounded,
    # fatal PostgreSQL readiness wait, so no compose dependency is declared
    # here: a dependency would re-enable the `standalone-db` profile and make
    # a bare `compose up` try to create containers whose names are already
    # taken by the live services.
    # Entrypoint runs migrations and verification, then execs this command
    # and exits. This message only prints if the entrypoint succeeded —
    # any migration/verification failure exits non-zero before reaching here.
    command: ["sh", "-c", "echo 'TRADINGO migrations applied and verified'"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.tradingo.in/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tradingo.in}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://tradingo.in}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://api.tradingo.in}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: tradingo-web
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production.local
    environment:
      NODE_ENV: production
      PORT: 3000
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: tradingo-nginx
    restart: unless-stopped
    networks:
      - tradingo-net
    # Only the reverse proxy is public; all other services stay on loopback.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      - ./infrastructure/nginx/sites:/etc/nginx/sites:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    depends_on:
      - api
      - web

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: tradingo-prometheus
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./ops/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: tradingo-pgexporter
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:9187:9187"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-tradingo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradingo}?sslmode=disable"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tradingo-grafana
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tradingo-alertmanager
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    volumes:
      - ./ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    entrypoint: ["/bin/sh", "-c", "echo \"$${SLACK_WEBHOOK_URL}\" > /etc/alertmanager/slack_webhook_url && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    container_name: tradingo-redis-exporter
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      REDIS_ADDR: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: tradingo-node-exporter
    restart: unless-stopped
    networks:
      - tradingo-net
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # OpenSearch — founder-approved strict-limit provisioning (2026-09-12).
  # Disposable search cache ONLY; PostgreSQL remains sole source of truth.
  # Internal-only: NO host port binding. API must NOT depend on this service.
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: tradingo-opensearch
    restart: unless-stopped
    networks:
      - tradingo-net
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.system_call_filter: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1.25G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
